services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    networks:
      - bigdata-net
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - bigdata-net
    restart: unless-stopped

  hbase:
    image: harisekhon/hbase:2.6
    container_name: hbase
    hostname: hbase
    ports:
      - "16010:16010" # HMaster Web UI
      - "9090:9090"   # HBase Thrift RPC server (FastAPI happybase)
    environment:
      HBASE_MANAGES_ZK: "true"
    networks:
      - bigdata-net
    restart: unless-stopped

  hive:
    image: apache/hive:4.2.1
    container_name: hive
    hostname: hive
    entrypoint: ["sh", "-c", "rm -f /opt/hive/conf/hiveserver2.pid && /entrypoint.sh"]
    ports:
      - "10000:10000" # HiveServer2 JDBC port
      - "10002:10002" # HiveServer2 Web UI
    environment:
      SERVICE_NAME: hiveserver2
    volumes:
      - ./data:/data
    networks:
      - bigdata-net
    restart: unless-stopped

networks:
  bigdata-net:
    driver: bridge
    name: bigdata-net
